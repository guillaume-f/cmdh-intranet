<!-- src/app/features/admin/pages/users/admin-users.component.html -->
<div class="p-8">

  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-bold text-white">Utilisateurs</h1>
      <p class="text-slate-400 text-sm mt-1">{{ users.length }} compte(s)</p>
    </div>
  </div>

  @if (loading) {
    <div class="flex justify-center py-20">
      <svg class="animate-spin w-8 h-8 text-blue-500" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </div>
  }

  @if (!loading) {
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-800">
            <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Utilisateur</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Rôle</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Statut</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          @for (user of users; track user.id) {
            <tr class="hover:bg-slate-800/40 transition-colors">
              <td class="px-5 py-3.5">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-xs font-bold text-slate-300 shrink-0">
                    {{ initials(user) }}
                  </div>
                  <div>
                    <p class="font-medium text-white">{{ user.firstName }} {{ user.lastName }}</p>
                    <p class="text-xs text-slate-500">{{ user.email }}</p>
                  </div>
                </div>
              </td>
              <td class="px-5 py-3.5">
                <select [value]="user.role" (change)="changeRole(user, $any($event.target).value)"
                  class="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg px-2 py-1 focus:outline-none focus:border-blue-500">
                  <option value="candidate">Candidat</option>
                  <option value="member">Membre</option>
                  <option value="encoder">Encodeur</option>
                  <option value="admin">Admin</option>
                </select>
              </td>
              <td class="px-5 py-3.5">
                @if (user.active) {
                  <span class="text-xs text-green-400 bg-green-400/10 px-2 py-0.5 rounded-full border border-green-400/20">Actif</span>
                } @else {
                  <span class="text-xs text-red-400 bg-red-400/10 px-2 py-0.5 rounded-full border border-red-400/20">Inactif</span>
                }
              </td>
              <td class="px-5 py-3.5">
                <button (click)="toggleActive(user)"
                  class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition-colors">
                  {{ user.active ? 'Désactiver' : 'Activer' }}
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
