<p-toast position="top-right"></p-toast>

<div class="min-h-screen flex items-center justify-center px-4" style="background: linear-gradient(135deg, var(--color-text-primary) 0%, #1a1a1a 100%)">
  <div class="w-full max-w-md">
    <p-card>
      <ng-template pTemplate="header">
        <div class="p-6 text-center text-white text-2xl font-bold" style="background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); font-family: 'Open Sans', sans-serif;">
          Connexion
        </div>
      </ng-template>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email field -->
        <div class="form-input-wrapper">
          <label for="email" class="form-label required">
            Email
          </label>
          <div class="flex flex-col gap-1">
            <input
              pInputText
              id="email"
              type="email"
              formControlName="email"
              class="w-full"
              placeholder="votre@email.com"
              [attr.aria-invalid]="isFieldInvalid('email')"
              [attr.aria-describedby]="
                isFieldInvalid('email') ? 'email-error' : null
              "
            />
            @if (isFieldInvalid('email') && isSubmitted()) {
              <p-message id="email-error" severity="error" variant="simple" size="small">
                {{ getErrorMessage('email') }}
              </p-message>
            }
          </div>
        </div>

        <!-- Password field -->
        <div class="form-input-wrapper">
          <label for="password" class="form-label required">
            Mot de passe
          </label>
          <div class="flex flex-col gap-1">
            <input
              pInputText
              id="password"
              type="password"
              formControlName="password"
              class="w-full"
              placeholder="••••••••"
              [attr.aria-invalid]="isFieldInvalid('password')"
              [attr.aria-describedby]="
                isFieldInvalid('password') ? 'password-error' : null
              "
            />
            @if (isFieldInvalid('password') && isSubmitted()) {
              <p-message id="password-error" severity="error" variant="simple" size="small">
                {{ getErrorMessage('password') }}
              </p-message>
            }
          </div>
        </div>

        <!-- Forgot password link -->
        <div class="text-right">
          <a
            routerLink="/auth/forgot-password"
            class="text-sm font-medium focus:outline-none focus:underline"
          >
            Mot de passe oublié ?
          </a>
        </div>

        <!-- Submit button -->
        <button
          pButton
          type="submit"
          label="Se connecter"
          class="w-full"
          [disabled]="isLoading()"
          [loading]="isLoading()"
        ></button>
      </form>
    </p-card>
  </div>
</div>
