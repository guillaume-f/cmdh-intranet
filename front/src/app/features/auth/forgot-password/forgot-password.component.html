<p-toast position="top-right"></p-toast>

<div class="min-h-screen flex items-center justify-center px-4" style="background: linear-gradient(135deg, var(--color-text-primary) 0%, #1a1a1a 100%)">
  <div class="w-full max-w-md">
    <p-card>
      <ng-template pTemplate="header">
        <div class="p-6 text-center text-white text-2xl font-bold" style="background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); font-family: 'Open Sans', sans-serif;">
          Mot de passe oublié
        </div>
      </ng-template>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Instructions -->
        <div class="alert alert-info">
          <div>
            <p class="alert-description">
              Entrez votre adresse email. Nous vous enverrons un lien pour
              réinitialiser votre mot de passe.
            </p>
          </div>
        </div>

        <!-- Email field -->
        <div class="form-input-wrapper">
          <label for="email" class="form-label required">
            Email
          </label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            class="w-full"
            placeholder="votre@email.com"
            [attr.aria-invalid]="isFieldInvalid('email')"
            [attr.aria-describedby]="
              isFieldInvalid('email') ? 'email-error' : null
            "
            [disabled]="isEmailSent()"
          />
          @if (isFieldInvalid('email') && isSubmitted()) {
            <span id="email-error" class="field-error" role="alert">
              {{ getErrorMessage('email') }}
            </span>
          }
        </div>

        <!-- Submit button -->
        <button
          pButton
          type="submit"
          label="Envoyer le lien"
          class="w-full p-button-primary"
          [disabled]="isLoading() || form.invalid || isEmailSent()"
          [loading]="isLoading()"
        ></button>

        <!-- Back to login link -->
        <div class="text-center">
          <a
            routerLink="/auth/login"
            class="text-sm font-medium focus:outline-none focus:underline"
            style="color: var(--color-text-secondary);"
          >
            Retour à la connexion
          </a>
        </div>
      </form>
    </p-card>
  </div>
</div>
