<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <!-- Header sidebar -->
    <div class="p-5 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <img src="/assets/imgs/logo-retina.png" alt="Compagnie Montoise des Hallebardiers" />
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      <a
        routerLink="/activities"
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors text-sm group"
      >
        <svg
          class="w-4.5 h-4.5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
        Activités
      </a>

      @if (canManageUsers()) {
        <div class="pt-3 pb-1">
          <p class="px-3 text-xs font-semibold text-slate-600 uppercase tracking-wider">
            Administration
          </p>
        </div>
        <a
          routerLink="/users"
          routerLinkActive="bg-slate-800 text-white"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors text-sm"
        >
          <svg
            class="w-4.5 h-4.5 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          Utilisateurs
        </a>
      }
    </nav>

    <!-- User info + logout -->
    <div class="p-3 border-t border-slate-800">
      <div class="flex items-center gap-3 px-3 py-2">
        <div
          class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center shrink-0 text-xs font-bold text-slate-300"
        >
          {{ userInitials() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">{{ userName() }}</p>
          <p class="text-xs text-slate-500 truncate">{{ roleLabel() }}</p>
        </div>
        <button
          (click)="logout()"
          title="Se déconnecter"
          class="text-slate-500 hover:text-red-400 transition-colors"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">
    <div class="flex flex-col">
      <router-outlet />
    </div>
  </main>
</div>
