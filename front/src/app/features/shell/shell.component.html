<div class="flex min-h-screen bg-slate-100">
  <!-- Sidebar -->
  <aside class="flex min-h-screen w-64 shrink-0 flex-col border-r border-slate-200 bg-white">
    <!-- Header sidebar -->
    <div class="border-b border-slate-200 p-5">
      <div class="flex items-center gap-3">
        <img
          class="h-auto w-full"
          src="/assets/imgs/logo-retina.png"
          alt="Compagnie Montoise des Hallebardiers"
        />
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      <a
        routerLink="/activities"
        routerLinkActive="bg-primary-50 text-primary-700"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
      >
        <i class="pi pi-calendar text-sm"></i>
        Activités
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="bg-primary-50 text-primary-700"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
      >
        <i class="pi pi-user text-sm"></i>
        Mon profil
      </a>

      @if (canManageUsers()) {
        <div class="pt-3 pb-1">
          <p class="px-3 pb-1 pt-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
            Administration
          </p>
        </div>
        <a
          routerLink="/users"
          routerLinkActive="bg-primary-50 text-primary-700"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
        >
          <i class="pi pi-users text-sm"></i>
          Utilisateurs
        </a>
      }
    </nav>
  </aside>

  <!-- Main content -->
  <main class="min-w-0 flex-1 overflow-y-auto">
    <div class="mx-auto flex min-h-[calc(100vh-3rem)] max-w-[1440px] flex-col overflow-hidden">
      <div class="flex flex-1 flex-col">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
